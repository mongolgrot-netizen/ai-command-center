name: Validate AI Command Center
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile app.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check app.js
